name: Naver Profile Alert

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: naver-profile-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Naver profile post count
        id: check
        shell: bash
        run: |
          python3 <<'PY'
          import html
          import os
          import re
          import shutil
          import subprocess
          import sys
          import urllib.request
          from pathlib import Path

          PROFILE_URL = "https://m.stock.naver.com/profile/28658298060583167"
          STATE_FILE = Path(".last_count")

          req = urllib.request.Request(
              PROFILE_URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                      "AppleWebKit/605.1.15 (KHTML, like Gecko) "
                      "Version/18.0 Mobile/15E148 Safari/604.1"
                  ),
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "ko-KR,ko;q=0.9,en-US;q=0.7,en;q=0.6",
                  "Referer": "https://m.stock.naver.com/",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  status = getattr(response, "status", 200)
                  if status != 200:
                      raise RuntimeError(f"HTTP {status}")
                  raw = response.read().decode("utf-8", errors="replace")
          except Exception as e:
              print(f"ERROR: Failed to load profile: {e}", file=sys.stderr)
              sys.exit(1)

          # Decode HTML entities and \uXXXX sequences that may appear inside page JSON.
          decoded = html.unescape(raw)
          decoded = re.sub(
              r"\\u([0-9a-fA-F]{4})",
              lambda m: chr(int(m.group(1), 16)),
              decoded,
          )

          # Also build a plain-text version to tolerate HTML tags between label and number.
          plain = re.sub(r"<script\b[^>]*>.*?</script>", " ", decoded, flags=re.I | re.S)
          plain = re.sub(r"<style\b[^>]*>.*?</style>", " ", plain, flags=re.I | re.S)
          plain = re.sub(r"<[^>]+>", " ", plain)
          plain = re.sub(r"\s+", " ", plain)

          patterns = [
              # Most specific first.
              r"토론글\s*전체\s*([0-9][0-9,]*)",
              r"전체\s*토론글\s*([0-9][0-9,]*)",
              r"토론글.{0,80}?전체.{0,40}?([0-9][0-9,]*)",
              r"전체\s*([0-9][0-9,]*)",
          ]

          def find_count(page):
              page = html.unescape(page)
              page = re.sub(
                  r"\\u([0-9a-fA-F]{4})",
                  lambda m: chr(int(m.group(1), 16)),
                  page,
              )
              visible = re.sub(r"<script\b[^>]*>.*?</script>", " ", page, flags=re.I | re.S)
              visible = re.sub(r"<style\b[^>]*>.*?</style>", " ", visible, flags=re.I | re.S)
              visible = re.sub(r"<[^>]+>", " ", visible)
              visible = re.sub(r"\s+", " ", visible)

              for source in (visible, page):
                  for pattern in patterns:
                      m = re.search(pattern, source, flags=re.I | re.S)
                      if m:
                          value = int(m.group(1).replace(",", ""))
                          # Sanity check: this profile already has many posts.
                          if value >= 100:
                              return value, pattern
              return None, None

          current, matched_pattern = find_count(raw)

          # Fallback: if the initial HTML does not contain the number,
          # render the public page with the Chrome already installed on GitHub's runner.
          if current is None:
              chrome = (
                  shutil.which("google-chrome")
                  or shutil.which("google-chrome-stable")
                  or shutil.which("chromium")
              )
              if chrome:
                  print("Count not found in initial HTML; trying headless Chrome fallback...")
                  try:
                      result = subprocess.run(
                          [
                              chrome,
                              "--headless=new",
                              "--no-sandbox",
                              "--disable-gpu",
                              "--disable-dev-shm-usage",
                              "--virtual-time-budget=6000",
                              "--dump-dom",
                              PROFILE_URL,
                          ],
                          capture_output=True,
                          text=True,
                          timeout=30,
                          check=False,
                      )
                      if result.returncode == 0:
                          current, matched_pattern = find_count(result.stdout)
                      else:
                          print(
                              f"Chrome fallback exited with code {result.returncode}",
                              file=sys.stderr,
                          )
                  except Exception as e:
                      print(f"Chrome fallback failed: {e}", file=sys.stderr)

          if current is None:
              print("ERROR: Could not find the total post count on the profile page.", file=sys.stderr)
              print("The Naver page structure may have changed.", file=sys.stderr)
              sys.exit(2)

          print(f"Current total posts: {current}")
          print(f"Matched with: {matched_pattern}")

          previous = None
          if STATE_FILE.exists():
              try:
                  previous = int(STATE_FILE.read_text(encoding="utf-8").strip())
              except Exception:
                  previous = None

          # First run: save baseline only, do not alert.
          if previous is None:
              STATE_FILE.write_text(str(current) + "\n", encoding="utf-8")
              notify = False
              delta = 0
              print(f"Initialized baseline: {current}")

          elif current > previous:
              delta = current - previous
              notify = True
              STATE_FILE.write_text(str(current) + "\n", encoding="utf-8")
              print(f"NEW POST(S): {previous} -> {current} (+{delta})")

          elif current < previous:
              # A deleted post can reduce the total. Quietly reset the baseline.
              delta = 0
              notify = False
              STATE_FILE.write_text(str(current) + "\n", encoding="utf-8")
              print(f"Count decreased (probably deletion): {previous} -> {current}")

          else:
              delta = 0
              notify = False
              print("No change.")

          output_file = os.environ.get("GITHUB_OUTPUT")
          if output_file:
              with open(output_file, "a", encoding="utf-8") as f:
                  f.write(f"notify={'true' if notify else 'false'}\n")
                  f.write(f"current={current}\n")
                  f.write(f"previous={previous if previous is not None else current}\n")
                  f.write(f"delta={delta}\n")
          PY

      - name: Create GitHub notification issue
        if: steps.check.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.check.outputs.current }}
          PREVIOUS: ${{ steps.check.outputs.previous }}
          DELTA: ${{ steps.check.outputs.delta }}
        shell: bash
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "🔔 동백인 새 글 +${DELTA} (${CURRENT})" \
            --assignee "$GITHUB_REPOSITORY_OWNER" \
            --body "동백인 프로필의 전체 토론글 수가 **${PREVIOUS} → ${CURRENT}** 로 증가했습니다.

          새 글 수: **+${DELTA}**

          확인: https://m.stock.naver.com/profile/28658298060583167"

      - name: Save new baseline
        shell: bash
        run: |
          # Monthly heartbeat keeps the public repository from becoming completely inactive.
          MONTH="$(date -u +%Y-%m)"
          if [ "$(cat .heartbeat 2>/dev/null || true)" != "$MONTH" ]; then
            echo "$MONTH" > .heartbeat
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .last_count .heartbeat

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update alert state [skip ci]"
            git push
          fi
